plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.peterlin.krypu.calltab'
version = '0.1.0'

android {
  namespace "com.peterlin.krypu.calltab"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Partial Custom Tabs (initial height, background interaction) need androidx.browser 1.6+
  implementation "androidx.browser:browser:1.9.0"
}
